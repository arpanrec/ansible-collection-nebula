---
- name: NodeJS | Molecule | Verify
  hosts: all
  gather_facts: false
  tasks:
      - name: NodeJS | Molecule | Verify | Import Roles For Variables
        ansible.builtin.import_role:
            name: arpanrec.nebula.nodejs
            tasks_from: prerequisites

      - name: NodeJS | Molecule | Verify | Set Nodejs Version Details
        ansible.builtin.set_fact:
            __nodejs_version_details: "{{ lookup('arpanrec.nebula.version_db', 'nodejs',
                nodejs_rv_version=nodejs_rv_version) | ansible.builtin.from_json }}"

      - name: NodeJS | Molecule | Verify | Get Node Version From Shell
        ansible.builtin.command: node --version
        environment:
            PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"
        register: __nodejs_rv_version_shell_result
        changed_when: false

      - name: NodeJS | Molecule | Verify | Fail If Nodejs Version Is Not Present
        ansible.builtin.assert:
            that: __nodejs_rv_version_shell_result.stdout == __nodejs_version_details.version
            success_msg: NodeJS Version {{ __nodejs_version_details.version }} is installed
            fail_msg: "NodeJS Version {{ __nodejs_version_details.version }} is not installed, \
                Shell result {{ __nodejs_rv_version_shell_result.stdout }}"

      - name: NodeJS | Molecule | Verify | Check Yarn Exists In Path
        ansible.builtin.command:
            argv:
                - yarn
                - --version
        environment:
            PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"
        changed_when: false

      - name: NodeJS | Molecule | Verify | Get Pnpm Shims In Install Path
        ansible.builtin.stat:
            path: "{{ nodejs_rv_install_path }}/bin/{{ item }}"
        register: __nodejs_rv_pnpm_shim_stat
        loop:
            - pnpm
            - pnpx

      - name: NodeJS | Molecule | Verify | Fail If Pnpm Is Provided By Node.js Or Corepack
        ansible.builtin.assert:
            that: not item.stat.exists
            fail_msg: "{{ item.item }} must not exist in {{ nodejs_rv_install_path }}/bin"
        loop: "{{ __nodejs_rv_pnpm_shim_stat.results }}"
        loop_control:
            label: "{{ item.item }}"

      - name: NodeJS | Molecule | Verify | List Npm Global Packages
        ansible.builtin.command:
            argv:
                - "{{ nodejs_rv_install_path }}/bin/npm"
                - ls
                - -g
                - --depth=0
                - --parseable
        environment:
            PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"
        register: __nodejs_rv_npm_global_list
        changed_when: false

      - name: NodeJS | Molecule | Verify | Fail If Pnpm Is An Npm Global Package
        ansible.builtin.assert:
            that: __nodejs_rv_npm_global_list.stdout_lines | ansible.builtin.select('search', pattern='/pnpm$')
                | ansible.builtin.list | ansible.builtin.length == 0
