---
name: Release

"on":
    push:
        tags:
            - "*"

permissions: {}

env:
    UV_MANAGED_PYTHON: "true"
    UV_LOCKED: "true"
    UV_PYTHON: "3.14.8"

jobs:
    release:
        name: Create GitHub Release
        if: github.server_url == 'https://github.com' && github.repository == 'arpanrec/ansible-collection-nebula'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        permissions:
            contents: write
        steps:
            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      echo "Release $TAG already exists"
                      exit 0
                  fi
                  prerelease=()
                  if [[ "$TAG" == *-* ]]; then
                      prerelease=(--prerelease)
                  fi
                  gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"

    galaxy:
        name: Ansible Galaxy Build & Publish
        if: github.server_url == 'https://github.com' && github.repository == 'arpanrec/ansible-collection-nebula'
        needs: release
        timeout-minutes: 30
        runs-on: ubuntu-26.04
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Tags aren't restricted to a branch, so a tag pushed on anything but main would otherwise still
            # publish. git branch -r --contains lists every remote branch the tagged commit is an ancestor of;
            # main must be among them.
            - name: Verify the tag is on main
              run: |
                  git fetch origin main
                  [[ -n "$(git branch -r --contains "${{ github.sha }}" --list 'origin/main')" ]] || {
                      echo "::error::${{ github.ref_name }} is not on main"
                      exit 1
                  }

            - name: Install uv 0.13.1
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  version: 0.13.1
                  python-version: "${{ env.UV_PYTHON }}"
                  enable-cache: true
                  cache-dependency-glob: |
                      **/uv.lock

            - name: Install dependencies
              run: uv sync --no-progress

            # scripts/release.sh writes the version into galaxy.yml before tagging; refuse to publish on a mismatch.
            - name: Check the tag matches the collection version
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  version="$(sed -n 's/^version: *//p' galaxy.yml)"
                  [[ "$version" == "$REF_NAME" ]] || {
                      echo "::error::Tag $REF_NAME does not match galaxy.yml version $version; use scripts/release.sh"
                      exit 1
                  }
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Build the collection
              run: uv --offline run --no-sync --no-progress ansible-galaxy collection build

            - name: Publish to Ansible Galaxy
              env:
                  GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
                  ARCHIVE: arpanrec-nebula-${{ steps.version.outputs.version }}.tar.gz
              run: >-
                  uv --offline run --no-sync --no-progress ansible-galaxy collection publish "$ARCHIVE"
                  --api-key "$GALAXY_API_KEY"

            - name: Attach the collection to the GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
                  ARCHIVE: arpanrec-nebula-${{ steps.version.outputs.version }}.tar.gz
              run: gh release upload "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
