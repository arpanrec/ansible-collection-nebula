---
- name: Oracle JDK | Apache Groovy | New Install
  block:
      - name: Oracle JDK | Apache Groovy | New Install | Remove Old Directory
        ansible.builtin.file:
            path: "{{ java_rv_jdk_groovy_install_path }}"
            state: absent

      - name: Oracle JDK | Apache Groovy | New Install | Recreate Install Directory
        ansible.builtin.file:
            path: "{{ java_rv_jdk_groovy_install_path }}"
            state: directory
            mode: "0700"

      - name: Oracle JDK | Apache Groovy | New Install | Copy New Files
        ansible.builtin.copy:
            src: "{{ __java_rv_jdk_groovy_tmp_unzip_path }}/groovy-{{
                __oracle_jdk_tmp_version_details.extras.groovy.version }}/"
            dest: "{{ java_rv_jdk_groovy_install_path }}/"
            remote_src: true
            mode: "0700"
  rescue:
      - name: Oracle JDK | Apache Groovy | New Install | Remove The Zip
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        with_items:
            - "{{ __java_rv_jdk_groovy_tmp_unzip_path }}/groovy-{{
              __oracle_jdk_tmp_version_details.extras.groovy.version }}/"
            - "{{ __java_rv_jdk_groovy_tarball_download_path }}"
