---
- name: Bun | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Bun | Create Install Directory
  ansible.builtin.file:
      path: "{{ bun_rv_executable_bin_path | ansible.builtin.dirname }}"
      state: directory
      mode: "0700"

- name: Bun | Get Release
  ansible.builtin.set_fact:
      __bun_version_details: "{{ lookup('arpanrec.nebula.version_db', 'bun',
          bun_rv_version=bun_rv_version) | ansible.builtin.from_json }}"

- name: Bun | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __bun_rv_zip_download_path }}"
  register: __bun_rv_tmp_downloaded_file_stat

- name: Bun | New Download
  when: not __bun_rv_tmp_downloaded_file_stat.stat.exists
  block:
      - name: Bun | New Download | Create Download Directory
        ansible.builtin.file:
            path: "{{ bun_rv_tmp_download_dir }}"
            state: directory
            mode: "0700"

      - name: Bun | New Download | Download Zip
        ansible.builtin.get_url:
            url: "{{ __bun_version_details.download_link }}"
            checksum: "{{ __bun_version_details.checksum | ansible.builtin.default(default_value=omit) }}"
            dest: "{{ __bun_rv_zip_download_path }}"
            mode: "0700"

  rescue:
      - name: Bun | New Download | Fail | Cleanup
        ansible.builtin.file:
            path: "{{ __bun_rv_zip_download_path }}"
            state: absent

      - name: Bun | New Download | Fail | Fail
        ansible.builtin.fail:
            msg: Something went wrong, check the errors above

- name: Bun | Create Temporary Unarchive Directory
  ansible.builtin.file:
      path: "{{ __bun_rv_tmp_unarchive_dir }}"
      state: directory
      mode: "0750"

- name: Bun | Unarchive The Zip
  ansible.builtin.unarchive:
      src: "{{ __bun_rv_zip_download_path }}"
      dest: "{{ __bun_rv_tmp_unarchive_dir }}"
      remote_src: true
      creates: "{{ __bun_rv_tmp_unarchive_dir }}/{{ __bun_version_details.extras.archive_dir }}/bun"

- name: Bun | Copy Binary To Dest
  ansible.builtin.copy:
      src: "{{ __bun_rv_tmp_unarchive_dir }}/{{ __bun_version_details.extras.archive_dir }}/bun"
      dest: "{{ bun_rv_executable_bin_path }}"
      mode: "0755"
      remote_src: true

- name: Bun | Link Bunx To Bun
  ansible.builtin.file:
      src: "{{ bun_rv_executable_bin_path }}"
      dest: "{{ __bun_rv_bunx_bin_path }}"
      state: link
      force: true
