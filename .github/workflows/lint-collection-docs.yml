---
name: Lint Collection Docs

"on":
    workflow_dispatch:
    pull_request:
        paths:
            - "**.py"
            - ".github/workflows/lint-collection-docs.yml"
            - "uv.lock"
            - "pyproject.toml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    UV_MANAGED_PYTHON: "true"
    UV_LOCKED: "true"

jobs:
    lint-collection-docs:
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12.14", "3.13.16", "3.14.8"]
        name: lint-collection-docs
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install uv 0.13.1
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  version: 0.13.1
                  python-version: "${{ matrix.python-version }}"
                  enable-cache: true
                  cache-suffix: python-${{ matrix.python-version }}
                  cache-dependency-glob: |
                      **/uv.lock

            - name: Install dependencies
              run: uv sync --all-extras --all-packages --no-progress
              env:
                  UV_PYTHON: ${{ matrix.python-version }}

            - name: Analyzing the code with lint-collection-docs
              run: uv --offline run --no-sync --no-progress antsibull-docs lint-collection-docs . --plugin-docs
              env:
                  UV_PYTHON: ${{ matrix.python-version }}
