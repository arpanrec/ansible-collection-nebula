---
name: Molecule Test Role Linux Patching

"on":
    workflow_dispatch:
    pull_request:
        paths:
            - "!roles/linux_patching/README.md"
            - ".github/workflows/molecule_test_role_linux_patching.yml"
            - "meta/**"
            - "molecule/role.linux_patching.docker/**"
            - "requirements.yml"
            - "roles/linux_patching/**"
            - "uv.lock"
            - "pyproject.toml"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    UV_MANAGED_PYTHON: "true"
    UV_LOCKED: "true"

jobs:
    molecule_test_role_linux_patching:
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12.14", "3.13.16", "3.14.8"]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install uv 0.13.1
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  version: 0.13.1
                  python-version: "${{ matrix.python-version }}"
                  enable-cache: true
                  cache-suffix: python-${{ matrix.python-version }}
                  cache-dependency-glob: |
                      **/uv.lock

            - name: Cache ansible
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.ansible
                      ~/.cache/ansible-*
                  key: ansible-cache-py.${{ matrix.python-version }}-${{ hashFiles('**/requirements.yml') }}

            - name: Install dependencies
              run: uv sync --all-extras --all-packages --no-progress
              env:
                  UV_PYTHON: ${{ matrix.python-version }}

            - name: Run Molecule Test
              run: uv --offline run --no-sync --no-progress molecule test -s role.linux_patching.docker
              env:
                  UV_PYTHON: ${{ matrix.python-version }}
