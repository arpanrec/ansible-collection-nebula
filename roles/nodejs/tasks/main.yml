---
- name: NodeJS | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: NodeJS | Get Version Details
  ansible.builtin.set_fact:
      __nodejs_version_details: "{{ lookup('arpanrec.nebula.version_db', 'nodejs',
          nodejs_rv_version=nodejs_rv_version) | ansible.builtin.from_json }}"

- name: NodeJS | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __nodejs_rv_tarball_download_path }}"
  register: __nodejs_rv_tmp_downloaded_file_stat

- name: NodeJS | New Download | Create Download Directory
  ansible.builtin.file:
      path: "{{ nodejs_rv_tmp_install_cache_dir }}"
      state: directory
      mode: "0700"

- name: NodeJS | New Download
  when: not __nodejs_rv_tmp_downloaded_file_stat.stat.exists
  block:
      - name: NodeJS | New Download | Download Tarball
        ansible.builtin.get_url:
            url: "{{ __nodejs_version_details.download_link }}"
            checksum: "{{ __nodejs_version_details.checksum | ansible.builtin.default(default_value=omit) }}"
            dest: "{{ __nodejs_rv_tarball_download_path }}"
            mode: "0700"
            timeout: 300
        timeout: 300

      - name: NodeJS | New Download | Remove Old Install Directory
        ansible.builtin.file:
            path: "{{ nodejs_rv_install_path }}"
            state: absent

  rescue:
      - name: NodeJS | New Download | Fail | Cleanup
        ansible.builtin.file:
            path: "{{ nodejs_rv_tmp_install_cache_dir }}"
            state: absent

      - name: NodeJS | New Download | Fail | Fail
        ansible.builtin.fail:
            msg: Something went wrong, check the errors above

- name: NodeJS | Create Install Directory
  ansible.builtin.file:
      path: "{{ nodejs_rv_install_path }}"
      state: directory
      mode: "0700"

- name: NodeJS | Unarchive The Tarball
  ansible.builtin.unarchive:
      src: "{{ __nodejs_rv_tarball_download_path }}"
      dest: "{{ nodejs_rv_install_path }}"
      extra_opts: [--strip-components=1]
      remote_src: true

- name: NodeJS | Remove Node.js Npm Global Pnpm And Yarn
  community.general.npm:
      name: "{{ item }}"
      global: true
      executable: "{{ nodejs_rv_install_path }}/bin/npm"
      state: absent
  with_items:
      - pnpm
      - yarn
  environment:
      PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"

- name: NodeJS | Install Node.js Package Globally
  community.general.npm:
      name: "{{ item }}"
      global: true
      executable: "{{ nodejs_rv_install_path }}/bin/npm"
  with_items: "{{ nodejs_rv_global_packages }}"
  environment:
      PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"

- name: NodeJS | Install Corepack Package Managers Pnpm & Yarn
  ansible.builtin.command:
      argv:
          - "{{ nodejs_rv_install_path }}/bin/corepack"
          - install
          - -g
          - "{{ item }}@latest"
  changed_when: false
  environment:
      PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"
  loop:
      - pnpm
      - yarn

- name: NodeJS | Prepare And Activate Corepack Pnpm
  ansible.builtin.command:
      argv:
          - "{{ nodejs_rv_install_path }}/bin/corepack"
          - prepare
          - pnpm@latest
          - --activate
  changed_when: false
  environment:
      PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"

- name: NodeJS | Enable Corepack Package Managers Pnpm & Yarn
  ansible.builtin.command:
      argv:
          - "{{ nodejs_rv_install_path }}/bin/corepack"
          - enable
          - "{{ item }}"
      creates: "{{ nodejs_rv_install_path }}/bin/{{ item }}"
  environment:
      PATH: "{{ nodejs_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"
  loop:
      - pnpm
      - yarn
