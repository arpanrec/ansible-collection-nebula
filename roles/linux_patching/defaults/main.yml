---
# defaults file for host_essentials

linux_patching_rv_install_devel_packages: true

linux_patching_rv_devel_packages:
    - net-tools
    - telnet
    - vim
    - git
    - git-lfs
    - jq
    - zsh
    - htop
    - tmux
    - tree
    - luarocks
    - build-essential
    - ninja-build
    - gettext
    - cmake
    - make
    - openssh-client
    - rsync
    - ntfs-3g
    - exfat-fuse
    - python3-pip
    - python3-venv
    - python3-dev
    - zip
    - unzip
    - tar
    - wget
    - curl
    - pigz
    - xz-utils
    - gzip
    - bzip2
    - autoconf
    - automake
    - gcc
    - g++
    - clang
    - libglib2.0-dev
    - libssl-dev
    - libffi-dev
    - zlib1g-dev

linux_patching_rv_packages:
    - ca-certificates
    - sudo
    - systemd
    - apt-transport-https
    - locales
    - systemd-timesyncd
    - network-manager
    - gnupg2
    - gnupg
    - acl
    - ufw
    - procps
    - apt-utils
    - lsb-release
    - python3
    - openssl
    - util-linux-extra
    - nftables
    - libatomic1

linux_patching_rv_extra_packages: []

linux_patching_rv_timezone: Asia/Kolkata

linux_patching_rv_hostname: "{{ ansible_facts.hostname
    | ansible.builtin.default(default_value='localhost', boolean=true) | ansible.builtin.mandatory }}"
linux_patching_rv_domain_name: "{{ ansible_facts.domain
    | ansible.builtin.default(default_value='localdomain', boolean=true) | ansible.builtin.mandatory }}"
# linux_patching_rv_root_ca_pem_content:

linux_patching_rv_ssh_port: 22
