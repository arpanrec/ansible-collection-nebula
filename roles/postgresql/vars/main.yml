postgresql_hba_rules:
    - contype: local
      databases: replication
      users: all
      method: peer

    - contype: local
      databases: all
      users: "{{ postgresql_super_user }}"
      method: peer

    - contype: local
      databases: all
      users: all
      method: peer

    - contype: host
      databases: replication
      users: all
      address: 127.0.0.1/32
      method: "{{ postgresql_auth_method }}"

    - contype: host
      databases: replication
      users: all
      address: ::1/128
      method: "{{ postgresql_auth_method }}"

    - contype: host
      databases: all
      users: all
      address: 127.0.0.1/32
      method: "{{ postgresql_auth_method }}"

    - contype: host
      databases: all
      users: all
      address: ::1/128
      method: "{{ postgresql_auth_method }}"

    - contype: hostssl
      databases: all
      users: all
      address: all
      method: "{{ postgresql_auth_method }}"
      options: clientcert=verify-full # verify-ca

postgresql_conf_options:
    - option: data_directory
      value: "'{{ postgresql_data_directory }}'"
    - option: hba_file
      value: "'{{ postgresql_hba_file }}'"
    - option: ident_file
      value: "'{{ postgresql_ident_file }}'"
    - option: external_pid_file
      value: "'{{ postgresql_external_pid_file }}'"

    - option: listen_addresses
      value: "'*'"
    - option: port
      value: "{{ postgresql_port }}"
    - option: max_connections
      value: 100

    - option: unix_socket_directories
      value: "'{{ postgresql_unix_socket_directories | ansible.builtin.join(d=',') }}'"

    - option: unix_socket_permissions
      value: "{{ postgresql_unix_socket_permissions }}"
    - option: unix_socket_group
      value: "'{{ postgresql_unix_socket_group }}'"

    - option: shared_buffers
      value: 128MB
    - option: dynamic_shared_memory_type
      value: posix

    - option: max_wal_size
      value: 1GB
    - option: min_wal_size
      value: 80MB

    - option: log_line_prefix
      value: "'%m [%p] %q%u@%d '"

    - option: log_timezone
      value: "'Asia/Kolkata'"

    - option: cluster_name
      value: "'{{ postgresql_version }}/{{ postgresql_cluster }}'"

    - option: datestyle
      value: "'iso, mdy'"
    - option: timezone
      value: "'Asia/Kolkata'"
    - option: lc_messages
      value: "'en_US.UTF-8'"
    - option: lc_monetary
      value: "'en_US.UTF-8'"
    - option: lc_numeric
      value: "'en_US.UTF-8'"
    - option: lc_time
      value: "'en_US.UTF-8'"
    - option: default_text_search_config
      value: "'pg_catalog.english'"

    - option: log_destination
      value: "'stderr'"
    - option: logging_collector
      value: "on"
    - option: log_directory
      value: "'log'"
    - option: log_filename
      value: "'postgresql-%Y-%m-%d_%H%M%S.log'"
    - option: log_file_mode
      value: "0600"
    - option: log_rotation_age
      value: 1d
    - option: log_rotation_size
      value: 10MB
    - option: log_truncate_on_rotation
      value: "off"
    - option: log_statement
      value: "'ddl'"
    - option: log_min_duration_statement
      value: -1
    - option: log_checkpoints
      value: "off"
    - option: log_connections
      value: "off"
    - option: log_disconnections
      value: "off"
    - option: log_lock_waits
      value: "off"
    - option: log_duration
      value: "off"
