---
- name: Bitwarden Secrets Manager SDK | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Bitwarden Secrets Manager SDK | Get Version Details
  ansible.builtin.set_fact:
      __bws_sdk_version_details: "{{ lookup('arpanrec.nebula.version_db', 'bws',
          bws_sdk_version_tag=bws_sdk_version_tag) | ansible.builtin.from_json }}"

- name: Bitwarden Secrets Manager SDK | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __bws_sdk_tmp_zip_download_path }}"
  register: __bws_sdk_tmp_zip_file_stat

- name: Bitwarden Secrets Manager SDK | New Install
  when: not __bws_sdk_tmp_zip_file_stat.stat.exists
  block:
      - name: Bitwarden Secrets Manager SDK | New Install | Download
        ansible.builtin.get_url:
            url: "{{ __bws_sdk_version_details.download_link }}"
            dest: "{{ __bws_sdk_tmp_zip_download_path }}"
            checksum: "{{ __bws_sdk_version_details.checksum | ansible.builtin.default(default_value=omit) }}"
            mode: "0700"

      - name: Bitwarden Secrets Manager SDK | New Install | Remove Old Directory
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        with_items:
            - "{{ bws_sdk_bin_dir }}/bws"
            - "{{ bws_sdk_tmp_dir }}/bws"
  rescue:
      - name: Bitwarden Secrets Manager SDK | New Install | Fail | Cleanup
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        with_items:
            - "{{ bws_sdk_bin_dir }}/bws"
            - "{{ bws_sdk_tmp_dir }}/bws"
            - "{{ __bws_sdk_tmp_zip_download_path }}"

      - name: Bitwarden Secrets Manager SDK | New Install | Fail | Fail
        ansible.builtin.fail:
            msg: Something went wrong, check the errors above

- name: Bitwarden Secrets Manager SDK | New Install | Extract To Tmp Directory
  ansible.builtin.unarchive:
      src: "{{ __bws_sdk_tmp_zip_download_path }}"
      dest: "{{ bws_sdk_tmp_dir }}"
      remote_src: true

- name: Bitwarden Secrets Manager SDK | New Install | Bin Directory | Create
  ansible.builtin.file:
      path: "{{ bws_sdk_bin_dir }}"
      state: directory
      mode: "0700"

- name: Bitwarden Secrets Manager SDK | New Install | Copy
  ansible.builtin.copy:
      src: "{{ bws_sdk_tmp_dir }}/bws"
      dest: "{{ bws_sdk_bin_dir }}/bws"
      mode: "0700"
      remote_src: true
