---
postgresql_service_group: postgres
postgresql_service_user: "{{ postgresql_service_group }}"
postgresql_default_conf_file: "/etc/postgresql/{{ postgresql_version }}\
    /{{ postgresql_cluster }}/postgresql.conf"
postgresql_pg_ctlcluster_start_file: "/etc/postgresql/{{ postgresql_version }}\
    /{{ postgresql_cluster }}/start.conf"
postgresql_pg_ctlcluster_pg_ctl_file: "/etc/postgresql/{{ postgresql_version }}\
    /{{ postgresql_cluster }}/pg_ctl.conf"
postgresql_pg_ctlcluster_systemd_service_name: "postgresql@{{ postgresql_version }}\
    -{{ postgresql_cluster }}.service"
postgresql_service_user_home: "/var/lib/postgresql"
# postgresql_external_pid_file is hard coded in /usr/lib/systemd/system/postgresql@.service as
# PIDFile=/run/postgresql/%i.pid, where variable %i expands to "version-cluster".
postgresql_external_pid_file: "/var/run/postgresql/{{ postgresql_version }}-{{ postgresql_cluster }}.pid"
postgresql_super_user: "{{ postgresql_service_user }}"
postgresql_super_user_db: "{{ postgresql_super_user }}"

